<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="nr-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffddb8" />
      <stop offset="50%" stop-color="#ffb95f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nr-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb95f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94de2d" stop-opacity="0.4" />
    </linearGradient>
    <filter id="nr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Chassis Shield Frame -->
  <polygon points="20,2 37,11 37,29 20,38 3,29 3,11" 
           fill="#121316" 
           stroke="url(#nr-border-grad)" 
           stroke-width="1.5" />
  
  <!-- Subtle Inner Grid / Tech Lines -->
  <line x1="20" y1="2" x2="20" y2="38" stroke="#343538" stroke-width="0.75" stroke-dasharray="2,2" />
  
  <!-- "N" Glyph Geometry -->
  <path d="M10 28 V12 L19 25 V12" 
        stroke="url(#nr-amber-grad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#nr-glow)" />

  <!-- "R" Glyph Geometry Interlocked -->
  <path d="M21 28 V12 H26.5 C29 12 30.5 13.5 30.5 16 C30.5 18.5 29 20 26.5 20 H21 M26 20 L30.5 28" 
        stroke="#94de2d" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Micro Telemetry Indicator Dot -->
  <circle cx="33" cy="7" r="1.5" fill="#94de2d" />
  <circle cx="7" cy="33" r="1.2" fill="#ffb95f" />
</svg>
